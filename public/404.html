<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeuroVisual | Bio-Enlaces</title>
    <script>
      // Redirect to repository base if route is missing
      var pathSegments = window.location.pathname.split('/').filter(Boolean);
      var repoBase = pathSegments.length > 0 ? '/' + pathSegments[0] + '/' : '/';
      if (window.location.pathname !== repoBase) {
        window.location.replace(repoBase);
      }
    </script>
  </head>
  <body>
    <p>Cargando NeuroVisual...</p>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeuroVisual | Bio-Enlaces</title>
    <script>
      // SPA fallback for GitHub Pages
      var pathname = window.location.pathname;
      var isAsset = /\.(js|css|jpg|jpeg|png|gif|svg|ico|json|woff|woff2)$/i.test(pathname);
      if (!isAsset) {
        var pathSegments = pathname.split('/').filter(Boolean);
        var repoBase = (pathSegments.length > 0 && !pathname.includes('.github.io'))
          ? '/' + pathSegments[0] + '/'
          : '/';
        if (pathname !== repoBase) {
          window.location.replace(repoBase);
        }
      }
    </script>
  </head>
  <body>
    <p>Cargando NeuroVisual...</p>
  </body>
</html>
